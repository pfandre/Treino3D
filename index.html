<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anatomia Muscular & Guia Especialista de Exercícios</title>
  
  <!-- PWA Setup -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS 3.4+ CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '.dark-theme'],
      theme: {
        extend: {
          colors: {
            background: '#0F172A',
            primaryText: '#F8FAFC',
            accent: '#84CC16',
            surface: '#1E293B',
            slate: {
              400: '#94a3b8',
              800: '#1e293b',
              900: '#0f172a'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Rajdhani', 'sans-serif'],
            mono: ['Roboto Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=45" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body id="main-body" class="dark-theme pb-[70px] md:pb-0 opacity-0 transition-opacity duration-700">

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-container" id="main-brand-container">
      <!-- Input oculto para upload da foto -->
      <input type="file" id="avatar-upload-input" accept="image/*" class="hidden">
      
      <div class="brand-icon relative overflow-hidden group !bg-zinc-800 !shadow-none !border !border-zinc-700" id="main-brand-icon" style="cursor: pointer;" title="Alterar Foto de Perfil">
        <i data-lucide="user" id="brand-activity-icon" class="!text-black !w-6 !h-6"></i>
        <img id="brand-avatar-img" class="w-full h-full object-cover hidden" src="" alt="Avatar">
        <!-- Ícone de upload que aparece no hover -->
        <div class="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity hidden" id="avatar-hover-overlay">
          <i data-lucide="camera" class="w-4 h-4 text-white"></i>
        </div>
      </div>
      <div>
        <h1 class="brand-title" id="main-brand-title">Anatomia & Musculação</h1>
        <div class="brand-subtitle" id="main-brand-subtitle">Desenho Anatômico Profissional & Guia de Exercícios de Atletas</div>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="header-actions">
      <div class="nav-tab-group hidden md:flex">
        <button id="btn-admin-dashboard" class="nav-tab-btn hidden !text-[#84CC16]" title="Painel de Administrador">
          <i data-lucide="shield" class="w-4 h-4"></i> Admin
        </button>
        <button id="tab-btn-dashboard" class="nav-tab-btn">
          <i data-lucide="bar-chart-2"></i> Dashboard
        </button>
        <button id="tab-btn-metas" class="nav-tab-btn">
          <i data-lucide="user"></i> Perfil e Metas
        </button>
        <button id="tab-btn-explorer" class="nav-tab-btn active">
          <i data-lucide="compass"></i> Explorar
        </button>
        <button id="tab-btn-planner" class="nav-tab-btn">
          <i data-lucide="calendar"></i> Montar Treino
        </button>
      </div>
      <div id="header-user-actions" class="hidden items-center gap-1.5 ml-4">

        <button id="btn-header-change-password" class="flex items-center justify-center w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white hover:bg-slate-700 transition-colors" title="Alterar Senha">
          <i data-lucide="key" class="w-[15px] h-[15px] pointer-events-none"></i>
        </button>
      </div>
      <button id="btn-header-auth" class="btn-primary" style="margin-left: 10px; font-size: 0.85rem; padding: 8px 16px; display: flex; align-items: center; gap: 6px;">
        <i data-lucide="user"></i> Entrar
      </button>
    </div>
  </header>

  <!-- Main Application Grid -->
  <main class="main-wrapper">
    
    <!-- Coluna Esquerda: Palco Anatômico 360° -->
    <section class="model-viewport-card">
      <div class="viewport-header">
        <div class="viewport-title">
          <i data-lucide="sparkles" style="color: var(--primary-lime)"></i>
          <span id="anatomy-title">Visão Anatômica Interativa</span>
        </div>
        <div class="view-mode-toggle" style="display: flex; gap: 8px;">
          <button id="btn-view-3d" class="ctrl-btn active" title="Visualização Ilustrada 360°">
            <i data-lucide="rotate-cw"></i> 360°
          </button>
        </div>
      </div>

      <!-- Container do Canvas / Imagem -->
      <div class="canvas-container" style="position: relative;">
        <!-- Nickname Overlay -->
        <div id="model-nickname-overlay" class="absolute top-4 left-1/2 -translate-x-1/2 z-10 text-[#84CC16] font-bold bg-[#0F172A]/80 backdrop-blur px-4 py-1.5 rounded-full border border-[#84CC16]/30 text-sm shadow-lg shadow-[#84CC16]/5 opacity-0 transition-opacity duration-300 pointer-events-none flex items-center gap-1.5">
          <i data-lucide="user" class="w-3.5 h-3.5"></i> Atleta
        </div>
        <div id="threejs-canvas-container" style="width: 100%; height: 100%;">
          <!-- Renderizado dinamicamente via JS -->
        </div>

      </div>

      <!-- Barra de Controle de Giro -->
      <div class="model-controls-bar">
        <button id="btn-view-front" class="ctrl-btn">
          <i data-lucide="arrow-left" style="width: 14px;"></i> Frente
        </button>
        <button id="btn-view-back" class="ctrl-btn">
          Costas <i data-lucide="arrow-right" style="width: 14px;"></i>
        </button>
        <button id="btn-auto-spin" class="ctrl-btn" title="Girar Automaticamente">
          <i data-lucide="rotate-cw" style="width: 14px;"></i> Giro Auto
        </button>
      </div>
    </section>

    <!-- Coluna Direita: Painel de Conteúdo -->
    <section class="content-card-panel">
      
      <!-- Painel do Explorador (Ativo por Padrão) -->
      <div id="explorer-panel-content" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
        
        <!-- Barra Superior de Ações -->
        <div class="panel-header-toolbar">
          <div class="search-box">
            <i data-lucide="search"></i>
            <input type="text" id="exercise-search-input" placeholder="Buscar exercício por nome, equipamento..." />
          </div>
          <button id="btn-add-new-ex" class="btn-primary" style="margin-left: 16px; font-size: 0.85rem; padding: 8px 16px; display: flex; align-items: center; gap: 6px;">
            <i data-lucide="plus"></i> Novo Exercício
          </button>
        </div>

        <!-- Barra de Filtros de Categoria -->
        <div id="category-filter-bar" class="category-filter-bar">
          <!-- Inserido dinamicamente via ExerciseUI -->
        </div>

        <!-- Detalhes do Músculo Ativo (Banner) -->
        <div id="muscle-banner-container" class="muscle-banner-details">
          <!-- Inserido dinamicamente via ExerciseUI -->
        </div>

        <!-- Lista Rolável de Exercícios -->
        <div id="exercise-list-container" class="exercise-scroll-list">
          <!-- Inserido dinamicamente via ExerciseUI -->
        </div>
      </div>

      <!-- Painel de Montador de Treino (Oculto por Padrão) -->
      <div id="planner-panel-content" class="planner-panel" style="display: none;">
        <div id="planner-container">
          <!-- Inserido dinamicamente via WorkoutPlanner -->
        </div>
      </div>

      <!-- Painel do Dashboard (Oculto por Padrão) -->
      <div id="dashboard-panel-content" style="display: none; overflow-y: auto; padding: 0;">
        <!-- Renderizado inteiramente via DashboardUI.js -->
      </div>

      <!-- Painel de Metas (Oculto por Padrão) -->
      <div id="metas-panel-content" style="display: none; overflow-y: auto; padding: 0; width: 100%; height: 100%; flex-direction: column;">
        <!-- Renderizado inteiramente via MetasUI.js -->
      </div>

    </section>

  </main>

  <!-- Mobile Bottom Navigation (Premium Animated) -->
  <nav id="mobile-bottom-nav" class="fixed bottom-0 left-0 right-0 z-[100] w-full md:hidden" style="padding-bottom: env(safe-area-inset-bottom);">
    <!-- Glassmorphism background bar -->
    <div class="relative flex items-end justify-around h-[75px]">
      <!-- Background shape with notch -->
      <div class="absolute inset-0 bg-[#0F172A]/90 backdrop-blur-2xl border-t border-white/[0.06] rounded-t-2xl shadow-[0_-8px_32px_rgba(0,0,0,0.5)]"></div>

      <!-- Stats -->
      <button id="mobile-tab-btn-dashboard" class="mobile-nav-item text-slate-500" data-tab="dashboard">
        <div class="mobile-nav-icon-wrap">
          <i data-lucide="bar-chart-2" stroke-width="1.8"></i>
        </div>
        <span class="mobile-nav-label">Stats</span>
        <div class="mobile-nav-indicator"></div>
      </button>

      <!-- Perfil -->
      <button id="mobile-tab-btn-metas" class="mobile-nav-item text-slate-500" data-tab="metas">
        <div class="mobile-nav-icon-wrap">
          <i data-lucide="user" stroke-width="1.8"></i>
        </div>
        <span class="mobile-nav-label">Perfil</span>
        <div class="mobile-nav-indicator"></div>
      </button>

      <!-- Explorar (Central Floating Button) -->
      <button id="mobile-tab-btn-explorer" class="mobile-nav-center-btn active" data-tab="explorer">
        <div class="mobile-nav-center-ring"></div>
        <div class="mobile-nav-center-inner">
          <i data-lucide="compass" stroke-width="2"></i>
        </div>
      </button>

      <!-- Treino -->
      <button id="mobile-tab-btn-planner" class="mobile-nav-item text-slate-500" data-tab="planner">
        <div class="mobile-nav-icon-wrap">
          <i data-lucide="calendar" stroke-width="1.8"></i>
        </div>
        <span class="mobile-nav-label">Treino</span>
        <div class="mobile-nav-indicator"></div>
      </button>
    </div>
  </nav>

  <!-- Container for Modals -->
  <div id="progression-modal-root"></div>
  <div id="profile-modal-root"></div>
  <div id="admin-modal-root"></div>

  <div id="transition-screen" class="fixed inset-0 z-[300] flex flex-col items-center justify-center bg-gray-900 opacity-0 pointer-events-none transition-opacity duration-700 overflow-hidden">
    <video id="transition-video" src="assets/video.mp4" class="w-full h-full object-cover" muted playsinline></video>
  </div>

  <!-- Script Principal App Orchestrator -->
  <script type="module" src="js/app.js?v=81"></script>

  <!-- Remove PWA Service Worker to prevent caching issues during development -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('ServiceWorker unregistered to clear cache');
          }
        });
      });
    }
  </script>
</body>
</html>
